<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Màn hình Thu ngân POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 480px;">
    <h2 class="mb-4 text-center">💰 Thu Ngân Thanh Toán (POS)</h2>
    <div class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="session-id-input" class="form-label">Nhập Session ID của bàn cần đóng:</label>
        <input type="text" id="session-id-input" class="form-control" placeholder="Ví dụ: sess_123456">
      </div>
      <button class="btn btn-danger w-100" onclick="handleCheckout()">Thanh Toán & Đóng Bàn</button>
    </div>
  </div>
  <script src="js/pos.js"></script>
</body>
</html>
