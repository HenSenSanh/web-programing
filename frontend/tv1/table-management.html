<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bàn ăn - DINEFLOW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-link {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
        }

        .nav-link:hover {
            background: #d9455a;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .table-card {
            border: 2px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }

        .table-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .table-card.available {
            border-color: #4CAF50;
            background: linear-gradient(135deg, #f1f8f4 0%, #e8f5e9 100%);
        }

        .table-card.occupied {
            border-color: #ff9800;
            background: linear-gradient(135deg, #fff8f0 0%, #ffe0b2 100%);
        }

        .table-number {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            font-weight: bold;
            margin: 10px 0;
            padding: 8px;
            border-radius: 5px;
            font-size: 14px;
        }

        .status.available {
            background: #4CAF50;
            color: white;
        }

        .status.occupied {
            background: #ff9800;
            color: white;
        }

        .btn-open {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s;
        }

        .btn-open:hover {
            background: #45a049;
        }

        .session-info {
            margin-top: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 5px;
            font-size: 11px;
            word-break: break-all;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            border-left: 4px solid #c62828;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        .toast.error {
            background: #f44336;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>️ Quản lý Bàn ăn</h1>
            <a href="menu-management.html" class="nav-link">🍽️ Sang Quản lý Menu</a>
        </div>
        <p class="subtitle">Hệ thống DINEFLOW - Theo dõi và quản lý trạng thái bàn ăn</p>
        
        <button class="refresh-btn" onclick="loadTables()">🔄 Tải lại danh sách bàn</button>
        
        <div id="message-area"></div>
        <div id="table-grid" class="table-grid">
            <div class="loading">Đang tải danh sách bàn...</div>
        </div>
    </div>

    <script>
        // ⚠️ QUAN TRỌNG: Địa chỉ API backend
        const API_BASE = 'http://localhost:8000/api/v1';

        // Hàm hiển thị thông báo (toast)
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Hàm hiển thị lỗi
        function showError(message) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        // Hàm xóa thông báo lỗi
        function clearError() {
            document.getElementById('message-area').innerHTML = '';
        }

        // Hàm tải danh sách bàn từ API
        async function loadTables() {
            clearError();
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '<div class="loading">Đang tải danh sách bàn...</div>';

            try {
                const response = await fetch(`${API_BASE}/admin/tables`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const tables = await response.json();
                renderTables(tables);
                showToast(`✅ Đã tải ${tables.length} bàn thành công`);
            } catch (error) {
                console.error('Lỗi khi tải bàn:', error);
                showError(`Không thể kết nối đến server! Đảm bảo backend đang chạy tại ${API_BASE}. Chi tiết: ${error.message}`);
                grid.innerHTML = '';
            }
        }

        // Hàm hiển thị danh sách bàn lên giao diện
        function renderTables(tables) {
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '';

            if (tables.length === 0) {
                grid.innerHTML = '<div class="loading">Không có bàn nào</div>';
                return;
            }

            tables.forEach(table => {
                const card = document.createElement('div');
                const isAvailable = table.status === 'AVAILABLE';
                card.className = `table-card ${isAvailable ? 'available' : 'occupied'}`;
                
                const statusText = isAvailable ? '✅ Trống' : '🔴 Đang phục vụ';
                const statusClass = isAvailable ? 'available' : 'occupied';
                
                // ✅ SỬA: Dùng đúng tên trường 'id' (không phải table_id)
                const tableId = table.id;
                
                // ✅ SỬA: Dùng trực tiếp table_number vì nó đã là chuỗi "Bàn 01"
                const tableDisplayName = table.table_number;
                
                let actionHTML = '';
                if (isAvailable) {
                    actionHTML = `<button class="btn-open" onclick="openTable(${tableId})">Mở bàn & Tạo QR</button>`;
                } else {
                    // 🎯 TẠO URL CHỨA SESSION TOKEN ĐỂ KHÁCH QUÉT (Mở trực tiếp từ thư mục frontend/menu đã gộp)
                    const orderPageUrl = new URL(`../menu/index.html?table=${tableId}&token=${table.current_session_token}`, window.location.href).href;
                    
                    // 📸 TẠO LINK ẢNH QR CODE TỰ ĐỘNG
                    const qrCodeImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(orderPageUrl)}`;

                    actionHTML = `
                        <div class="session-info" style="text-align: center;">
                            <strong style="color: #4CAF50;">📱 QR Code cho khách quét:</strong><br>
                            <a href="${orderPageUrl}" target="_blank" title="Bấm vào ảnh QR để mở Menu khách">
                                <img src="${qrCodeImageUrl}" 
                                    alt="QR Code" 
                                    style="margin: 10px auto; border: 2px solid #4CAF50; border-radius: 8px; padding: 5px; background: white; cursor: pointer;"
                                    width="150" height="150">
                            </a>
                            <div style="margin: 6px 0;">
                                <a href="${orderPageUrl}" target="_blank" style="display: inline-block; background: #4CAF50; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px;">
                                    👉 Mở Menu Đặt Món (TV2)
                                </a>
                            </div>
                            <div style="font-size: 11px; color: #666; word-break: break-all;">
                                Token: ${table.current_session_token || 'N/A'}
                            </div>
                        </div>
                    `;
                }
                
                card.innerHTML = `
                    <div class="table-number">${tableDisplayName}</div>
                    <div class="status ${statusClass}">${statusText}</div>
                    ${actionHTML}
                `;
                
                grid.appendChild(card);
            });
        }

        // Hàm mở bàn (tạo session mới)
        async function openTable(tableId) {
            if (!confirm(`Bạn có chắc muốn mở bàn #${tableId}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/tables/${tableId}/open-session`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    let errorMsg = `Lỗi HTTP: ${response.status}`;
                    try {
                        const errorData = await response.json();
                        // FastAPI thường trả lỗi trong trường 'detail'
                        if (errorData.detail) {
                            // Nếu detail là mảng (lỗi validation), lấy thông báo đầu tiên
                            if (Array.isArray(errorData.detail)) {
                                errorMsg = errorData.detail[0].msg || JSON.stringify(errorData.detail);
                            } else {
                                errorMsg = errorData.detail;
                            }
                        } else {
                            errorMsg = JSON.stringify(errorData);
                        }
                    } catch (e) {
                        // Nếu không đọc được JSON, giữ nguyên mã lỗi HTTP
                        console.error("Không thể parse lỗi JSON:", e);
                    }
                    throw new Error(errorMsg);
                }
                
                const data = await response.json();
                showToast(`✅ Đã mở bàn #${tableId} thành công!`);
                
                // Tải lại danh sách bàn sau 0.5 giây để cập nhật trạng thái mới
                setTimeout(() => {
                    loadTables();
                }, 500);
                
            } catch (error) {
                console.error('Lỗi khi mở bàn:', error);
                showToast(`❌ Không thể mở bàn! Chi tiết: ${error.message}`, true);
            }
        }

        // Tải danh sách bàn khi trang web mở
        window.addEventListener('DOMContentLoaded', () => {
            loadTables();
        });
    </script>
</body>
</html>
