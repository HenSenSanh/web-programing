version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dineflow_postgres
    restart: always
    environment:
      POSTGRES_USER: dineflow_user
      POSTGRES_PASSWORD: dineflow_password
      POSTGRES_DB: dineflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dineflow_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: