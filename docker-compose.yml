version: '3.8'

services:
  php-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dineflow_php_app
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./frontend:/var/www/html/public/frontend
      - ./demo_tester.html:/var/www/html/public/demo_tester.html
      - ./tests:/var/www/tests
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - dineflow_network

  mysql:
    image: mysql:8.0
    container_name: dineflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-login_system}
      MYSQL_USER: ${DB_USERNAME:-login_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-login_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dineflow_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dineflow_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - dineflow_network

volumes:
  mysql_data:

networks:
  dineflow_network:
    driver: bridge
