services:
  php-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dineflow_php_app
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./composer.json:/var/www/html/composer.json
      - php_vendor:/var/www/html/vendor
      - ./tests:/var/www/tests
      - ./database:/var/www/database
      - tunnel_logs:/var/log/cloudflared:ro
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - dineflow_network

  mysql:
    image: mysql:8.0
    container_name: dineflow_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-login_system}
      MYSQL_USER: ${DB_USERNAME:-login_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-login_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dineflow_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dineflow_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - dineflow_network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dineflow_tunnel
    user: "0:0"
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://php-app:80 --logfile /var/log/cloudflared/tunnel.log
    volumes:
      - tunnel_logs:/var/log/cloudflared
    depends_on:
      - php-app
    networks:
      - dineflow_network

volumes:
  mysql_data:
  php_vendor:
  tunnel_logs:

networks:
  dineflow_network:
    driver: bridge
